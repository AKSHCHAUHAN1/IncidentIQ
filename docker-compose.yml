services:

  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_predictor
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics
    ports:
      - "8428:8428"
    command:
      - "-retentionPeriod=7"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: unless-stopped

  synthetic-generator:
    build: ./services/synthetic-generator
    environment:
      REDIS_HOST: redis
      MODE: spike          # normal=training data | spike=test remediation
    depends_on:
      - redis
    restart: unless-stopped

  prometheus-producer:
    build: ./services/prometheus-producer
    environment:
      REDIS_HOST: redis
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      - redis
      - prometheus
    restart: unless-stopped

  data-ingestion:
    build: ./services/data-ingestion
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      VICTORIA_URL: http://victoria-metrics:8428
      ML_URL: http://ml-service:8000/predict
      DECISION_URL: http://decision-engine:5000/evaluate
      INPUT_WINDOW: 20
    ports:
      - "4000:4000"
    depends_on:
      - redis
      - postgres
      - ml-service
      - decision-engine
    restart: unless-stopped

  ml-service:
    platform: linux/amd64
    build:
      context: ./services/ml-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=incident_predictor
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ml_models:/app/models
    depends_on:
      - postgres
    restart: unless-stopped

  decision-engine:
    build: ./services/decision-engine
    container_name: decision-engine
    ports:
      - "5000:5000"
    environment:
      REMEDIATION_URL: http://remediation-engine:6000/act
      API_GATEWAY_URL: http://api-gateway:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incident_predictor
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
      - remediation-engine
    restart: unless-stopped

  remediation-engine:
    build: ./services/remediation-engine
    container_name: remediation-engine
    ports:
      - "6000:6000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incident_predictor
      DB_USER: postgres
      DB_PASSWORD: postgres
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incident_predictor
      DB_USER: postgres
      DB_PASSWORD: postgres
      REMEDIATION_URL: http://remediation-engine:6000
      JWT_SECRET: incidentiq-dev-secret
      PORT: 3000
    depends_on:
      - postgres
      - remediation-engine
      - decision-engine
    restart: unless-stopped

volumes:
  pg_data:
  grafana_data:
  ml_models: