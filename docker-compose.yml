services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    platform: linux/arm64
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       incident_predictor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── Website probe — scans URLs added via frontend ───────────
  website-probe:
    build:
      context: ./services/website-probe
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      DB_HOST:    postgres
      DB_USER:    postgres
      DB_PASSWORD: postgres
      DB_NAME:    incident_predictor
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Synthetic generator — ONLY for development/testing ──────
  # Switch MODE: spike to test the approval flow
  # Switch MODE: mixed to simulate realistic degradation
  # DISABLE in production by removing this service
  synthetic-generator:
    build:
      context: ./services/synthetic-generator
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      MODE: mixed   # normal | spike | ramp | mixed
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    profiles:
      - dev   # only starts with: docker compose --profile dev up

  # ── Data ingestion ───────────────────────────────────────────
  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      DB_HOST:    postgres
      DB_USER:    postgres
      DB_PASSWORD: postgres
      DB_NAME:    incident_predictor
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── ML Service ───────────────────────────────────────────────
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    environment:
      DB_HOST:     postgres
      DB_USER:     postgres
      DB_PASSWORD: postgres
      DB_NAME:     incident_predictor
    volumes:
      - ml_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Decision Engine ──────────────────────────────────────────
  decision-engine:
    build:
      context: ./services/decision-engine
      dockerfile: Dockerfile
    environment:
      REDIS_HOST:      redis
      DB_HOST:         postgres
      DB_USER:         postgres
      DB_PASSWORD:     postgres
      DB_NAME:         incident_predictor
      ML_SERVICE_URL:  http://ml-service:8000
      API_GATEWAY_URL: http://api-gateway:3000
      REMEDIATION_URL: http://remediation-engine:4000
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Remediation Engine ───────────────────────────────────────
  remediation-engine:
    build:
      context: ./services/remediation-engine
      dockerfile: Dockerfile
    environment:
      DB_HOST:     postgres
      DB_USER:     postgres
      DB_PASSWORD: postgres
      DB_NAME:     incident_predictor
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      DB_HOST:     postgres
      DB_USER:     postgres
      DB_PASSWORD: postgres
      DB_NAME:     incident_predictor
      JWT_SECRET:  change-this-in-production
      PORT:        3000
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:      # persists trained models across rebuilds