services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    platform: linux/arm64
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       incident_predictor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # ── Website Probe ────────────────────────────────────────────
  # Writes real TTFB, DNS, TLS, SSL, error_rate to TimescaleDB.
  website-probe:
    build:
      context: ./services/website-probe
      dockerfile: Dockerfile
    environment:
      DB_HOST:            postgres
      DB_USER:            postgres
      DB_PASSWORD:        postgres
      DB_NAME:            incident_predictor
      DATABASE_URL:       postgresql://postgres:postgres@postgres:5432/incident_predictor
      REDIS_HOST:         redis
      PROBE_INTERVAL_MS:  60000
      REQUEST_TIMEOUT_MS: 15000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Data Collector ────────────────────────────────────────────
  #  public status pages (GitHub, Stripe, Cloudflare, Vercel, npm, etc.)
  data-collector:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:   postgresql://postgres:postgres@postgres:5432/incident_predictor
      DB_HOST:        postgres
      DB_USER:        postgres
      DB_PASSWORD:    postgres
      DB_NAME:        incident_predictor
      CRUX_INTERVAL_HOURS:    24
      STATUS_INTERVAL_HOURS:  6
      # Optional: speeds up CrUX fetching from 150/day to 150/100s
      # Get free key: console.cloud.google.com → Enable "Chrome UX Report API"
      GOOGLE_API_KEY: "AIzaSyCb6nJx7lZNuDeQoPVqLchYd-TRY16JqWc"
    command: python3 src/collector_scheduler.py
    volumes:
      - ./services/website-probe/probe-targets.json:/app/probe-targets.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── ML Labeler ────────────────────────────────────────────────
  ml-labeler:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/incident_predictor
      DB_HOST:      postgres
      DB_USER:      postgres
      DB_PASSWORD:  postgres
      DB_NAME:      incident_predictor
    command: >
      sh -c "
        echo 'ML Labeler starting — runs every 6 hours';
        while true; do
          echo '[labeler] Running label_probe_data.py...';
          python src/label_probe_data.py;
          echo '[labeler] Done. Sleeping 6 hours...';
          sleep 21600;
        done
      "
    volumes:
      - ml_models:/app/models
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── ML Service ────────────────────────────────────────────────
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/incident_predictor
      DB_HOST:      postgres
      DB_USER:      postgres
      DB_PASSWORD:  postgres
      DB_NAME:      incident_predictor
      SLA_TTFB_MS:  2000
      MODEL_DIR:    /app/models
    volumes:
      - ml_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Data Ingestion ────────────────────────────────────────────
  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    environment:
      REDIS_HOST:   redis
      DB_HOST:      postgres
      DB_USER:      postgres
      DB_PASSWORD:  postgres
      DB_NAME:      incident_predictor
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/incident_predictor
      INPUT_WINDOW: 10
      ML_URL:       http://ml-service:8000/ensemble
      DECISION_URL: http://decision-engine:5000/evaluate
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── Decision Engine ───────────────────────────────────────────
  decision-engine:
    build:
      context: ./services/decision-engine
      dockerfile: Dockerfile
    environment:
      REDIS_HOST:      redis
      DB_HOST:         postgres
      DB_USER:         postgres
      DB_PASSWORD:     postgres
      DB_NAME:         incident_predictor
      DATABASE_URL:    postgresql://postgres:postgres@postgres:5432/incident_predictor
      ML_SERVICE_URL:  http://ml-service:8000
      API_GATEWAY_URL: http://api-gateway:3000
      SLA_TTFB_MS:     2000
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      DB_HOST:      postgres
      DB_USER:      postgres
      DB_PASSWORD:  postgres
      DB_NAME:      incident_predictor
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/incident_predictor
      JWT_SECRET:   change-this-in-production
      PORT:         3000
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    restart: unless-stopped


volumes:
  postgres_data:
  ml_models: